name: Release Pipeline

'on':
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish (must match format vX.Y.Z, e.g., v0.1.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ".[dev]"

      - name: Run test suite
        run: |
          pytest -v

  build-python:
    name: Build Wheel and Source Distribution
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip build wheel

      - name: Build distributions
        run: |
          python -m build --sdist --wheel --outdir dist/

      - name: Upload Python distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/*
          retention-days: 1

  build-rpm:
    name: Build Standalone Fedora RPM
    needs: [test, build-python]
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download Python distribution artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist

      - name: Build Standalone RPM inside Fedora container
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            fedora:41 \
            bash -c "
              set -euo pipefail
              dnf install -y rpm-build python3-devel python3-pip python3-wheel python3-setuptools
              VERSION=\$(grep -E '^version = ' pyproject.toml | head -n 1 | cut -d '\"' -f 2)
              ./packaging/rpm/build_rpm.sh \"\${VERSION}\" 1
            "

      - name: Upload RPM distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rpm-dist
          path: dist/*.rpm
          retention-days: 1

  release:
    name: Publish GitHub Release
    needs: [test, build-python, build-rpm]
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Release Tag
        run: |
          TARGET_TAG="${{ github.event.inputs.tag || github.ref_name }}"
          if [[ ! "${TARGET_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+.*$ ]]; then
            echo "ERROR: Invalid tag format '${TARGET_TAG}'. Must start with 'v' followed by semantic version (e.g. v0.1.0)." >&2
            exit 1
          fi
          echo "RELEASE_TAG=${TARGET_TAG}" >> "$GITHUB_ENV"

      - name: Download Python distributions
        uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: release-artifacts

      - name: Download RPM distributions
        uses: actions/download-artifact@v4
        with:
          name: rpm-dist
          path: release-artifacts

      - name: Verify Required Artifacts Exist
        working-directory: release-artifacts
        run: |
          ls -la
          if ! compgen -G "*.whl" > /dev/null; then
            echo "ERROR: Missing required Python wheel artifact (*.whl)!" >&2
            exit 1
          fi
          if ! compgen -G "*.rpm" > /dev/null; then
            echo "ERROR: Missing required Fedora RPM artifact (*.rpm)!" >&2
            exit 1
          fi
          if ! compgen -G "*.tar.gz" > /dev/null; then
            echo "ERROR: Missing required source tarball (*.tar.gz)!" >&2
            exit 1
          fi

      - name: Generate SHA-256 Checksums
        working-directory: release-artifacts
        run: |
          sha256sum * > checksums.txt
          echo "Generated Checksums:"
          cat checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: release-artifacts/*
          generate_release_notes: true
          fail_on_unmatched_files: true
