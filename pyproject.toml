[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "soulwave"
version = "0.1.2"
description = "A cute terminal music controller with a grooving pixel-art soul mascot"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Soulwave Contributors" }
]
dependencies = [
    "textual>=0.70.0",
    "rich>=13.0.0",
    "requests>=2.28.0",
    "syncedlyrics==1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.20.0",
    "pyyaml>=6.0",
]

[project.scripts]
soulwave = "soulwave.cli:main"

[tool.setuptools.packages.find]
include = ["soulwave*"]

[tool.setuptools.package-data]
"soulwave.ui" = ["*.tcss"]
